services:

  # ==================================================
  # 1. ASP.NET CORE WEBSITE
  # ==================================================
  web:
    build:
      context: ./InventoryManagement
      dockerfile: Dockerfile

    container_name: inventory-final-web
    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=${MYSQL_DATABASE};User=${MYSQL_USER};Password=${MYSQL_PASSWORD};"

    ports:
      - "5000:8080"

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - inventory_network


  # ==================================================
  # 2. MYSQL DATABASE
  # ==================================================
  mysql:
    image: mysql:8.0
    container_name: inventory-final-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"

    ports:
      - "3308:3306"

    volumes:
      - inventory_mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p${MYSQL_ROOT_PASSWORD} || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - inventory_network


  # ==================================================
  # 3. PHPMYADMIN
  # ==================================================
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: inventory-final-phpmyadmin
    restart: unless-stopped

    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306

    ports:
      - "8086:80"

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - inventory_network


  # ==================================================
  # 4. NGINX REVERSE PROXY
  # ==================================================
  nginx:
    image: nginx:alpine
    container_name: inventory-final-nginx
    restart: unless-stopped

    ports:
      - "8088:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - web

    networks:
      - inventory_network


  # ==================================================
  # 5. PROMETHEUS
  # ==================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: inventory-final-prometheus
    restart: unless-stopped

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    ports:
      - "9091:9090"

    networks:
      - inventory_network


  # ==================================================
  # 6. GRAFANA
  # ==================================================
  grafana:
    image: grafana/grafana:latest
    container_name: inventory-final-grafana
    restart: unless-stopped

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: Admin@Inventory2026

    ports:
      - "3001:3000"

    volumes:
      - inventory_grafana_data:/var/lib/grafana

    depends_on:
      - prometheus

    networks:
      - inventory_network


  # ==================================================
  # 7. CADVISOR - GIAM SAT CONTAINER
  # ==================================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: inventory-final-cadvisor
    restart: unless-stopped

    privileged: true

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

    networks:
      - inventory_network


  # ==================================================
  # 8. MYSQL EXPORTER - GIAM SAT DATABASE
  # ==================================================
  mysql-exporter:
    image: prom/mysqld-exporter:latest
    container_name: inventory-final-mysql-exporter
    restart: unless-stopped

    command:
      - "--mysqld.username=${MYSQL_USER}:${MYSQL_PASSWORD}"
      - "--mysqld.address=mysql:3306"

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - inventory_network


  # ==================================================
  # 9. LOKI - LUU TRU LOG TAP TRUNG
  # ==================================================
  loki:
    image: grafana/loki:latest
    container_name: inventory-final-loki
    restart: unless-stopped

    command:
      - "-config.file=/etc/loki/local-config.yaml"

    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - inventory_loki_data:/loki

    ports:
      - "3100:3100"

    networks:
      - inventory_network


  # ==================================================
  # 10. PROMTAIL - THU THAP LOG DOCKER
  # ==================================================
  promtail:
    image: grafana/promtail:latest
    container_name: inventory-final-promtail
    restart: unless-stopped

    command:
      - "-config.file=/etc/promtail/config.yml"

    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

    depends_on:
      - loki

    networks:
      - inventory_network


# ====================================================
# VOLUMES
# ====================================================
volumes:
  inventory_mysql_data:
  inventory_grafana_data:
  inventory_loki_data:


# ====================================================
# NETWORK
# ====================================================
networks:
  inventory_network:
    driver: bridge
