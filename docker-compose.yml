services:

  # ==================================================
  # 1. ASP.NET CORE WEBSITE
  # ==================================================
  web:
    build:
      context: ./InventoryManagement
      dockerfile: Dockerfile

    container_name: inventory-final-web
    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=${MYSQL_DATABASE};User=${MYSQL_USER};Password=${MYSQL_PASSWORD};"

    ports:
      - "5000:8080"

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - inventory_network


  # ==================================================
  # 2. MYSQL DATABASE
  # ==================================================
  mysql:
    image: mysql:8.0

    container_name: inventory-final-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"

    ports:
      - "3308:3306"

    volumes:
      - inventory_mysql_data:/var/lib/mysql

    networks:
      - inventory_network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p${MYSQL_ROOT_PASSWORD} || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  # ==================================================
  # 3. PHPMYADMIN
  # ==================================================
  phpmyadmin:
    image: phpmyadmin:latest

    container_name: inventory-final-phpmyadmin
    restart: unless-stopped

    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306

    ports:
      - "8086:80"

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - inventory_network


  # ==================================================
  # 4. NGINX REVERSE PROXY
  # ==================================================
  nginx:
    image: nginx:alpine

    container_name: inventory-final-nginx
    restart: unless-stopped

    ports:
      - "8088:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - web

    networks:
      - inventory_network


# ====================================================
# VOLUME
# ====================================================
volumes:
  inventory_mysql_data:


# ====================================================
# NETWORK
# ====================================================
networks:
  inventory_network:
    driver: bridge
